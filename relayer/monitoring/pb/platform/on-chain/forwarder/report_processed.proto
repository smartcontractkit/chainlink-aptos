syntax="proto3";

package platform.on_chain.forwarder;
option go_package = ".;forwarder";

// The on-chain ReportProcessed event which is extracted from the tx/event data or
// the write-target WriteConfirmed event, after a write was confirmed (@see message: platform.write-target.WriteConfirmed).
message ReportProcessed {
  // Event data
  string receiver = 1;
  bytes workflow_execution_id = 2;
  uint32 report_id = 3;
  bool success = 4;

  // TODO: Transaction data - tx that mained the event (e.g., hash, gas, transmitter, payload, etc.)

  // Head data - when was the event produced on-chain
  string block_hash = 5;
  string block_height = 6;
  uint64 block_timestamp = 7;

  // [Execution Context]
  // TODO: replace with a proto reference once supported

  // Execution Context - Chain
  string meta_chain_name = 20;
  string meta_network_name = 21;
  string meta_network_chain_id = 22;

  // Execution Context - Workflow (capabilities.RequestMetadata)
  string meta_workflow_id = 23;
  string meta_workflow_owner = 24;
  string meta_workflow_execution_id = 25;
  string meta_workflow_name = 26;
  uint32 meta_workflow_don_id = 27;
  uint32 meta_workflow_don_config_version = 28;
  string meta_reference_id = 29;

  // Execution Context - Capability
  string meta_capability_type = 30;
  string meta_capability_id = 31;
}
