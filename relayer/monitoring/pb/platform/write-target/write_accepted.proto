syntax="proto3";

package platform.write_target;
option go_package = ".;write_target";

// WT sent a transaction and it was accepted on-chain
//
// Notice: we publish txId (TXM ref) and txHash (in the future should be available here)
message WriteAccepted {
  string node = 1;
  string forwarder = 2;
  string receiver = 3;

  // Report Info
  uint32 report_id = 4;

  // Transaction ID - tx reference as created by the WT, to be used for tracking TXM execution
  string tx_id = 5;
  string tx_hash = 6;
  string tx_from = 7;
  string tx_status = 8;

  // When was the transaction accepted on-chain
  string block_hash = 9;
  string block_height = 10;
  uint64 block_timestamp = 11;

  // [Execution Context]
  // TODO: replace with a proto reference once supported

  // Execution Context - Chain
  string meta_chain_name = 20;
  string meta_network_name = 21;
  string meta_network_chain_id = 22;

  // Execution Context - Workflow (capabilities.RequestMetadata)
  string meta_workflow_id = 23;
  string meta_workflow_owner = 24;
  string meta_workflow_execution_id = 25;
  string meta_workflow_name = 26;
  uint32 meta_workflow_don_id = 27;
  uint32 meta_workflow_don_config_version = 28;
  string meta_reference_id = 29;

  // Execution Context - Capability
  string meta_capability_type = 30;
  string meta_capability_id = 31;
}
