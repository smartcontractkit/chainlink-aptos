syntax="proto3";

package platform.write_target;
option go_package = ".;write_target";

// WT errored while processing write request
message WriteError {
  uint32 code = 1;
  string summary = 2;
  string cause = 3;

  string node = 4;
  string forwarder = 5;
  string receiver = 6;

  // Report Info
  uint32 report_id = 7;

  // [Execution Context]
  // TODO: replace with a proto reference once supported

  // Execution Context - Chain
  string meta_chain_family_name = 20;
  string meta_chain_id = 21;
  string meta_network_name = 22;
  string meta_network_name_full = 23;

  // Execution Context - Workflow (capabilities.RequestMetadata)
  string meta_workflow_id = 24;
  string meta_workflow_owner = 25;
  string meta_workflow_execution_id = 26;
  string meta_workflow_name = 27;
  uint32 meta_workflow_don_id = 28;
  uint32 meta_workflow_don_config_version = 29;
  string meta_reference_id = 30;

  // Execution Context - Capability
  string meta_capability_type = 31;
  string meta_capability_id = 32;
}
