syntax="proto3";

package keystone.write_target;
option go_package = ".;write_target";

// WT errored while processing write request
message WriteError {
  uint32 code = 1;
  string summary = 2;
  string cause = 3;

  string node = 4;
  string forwarder = 5;
  string receiver = 6;

  // Report Info
  uint32 report_id = 7;
}
