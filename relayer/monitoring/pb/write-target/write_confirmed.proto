syntax="proto3";

package write_target;
option go_package = ".;write_target";

// WT confirmed the report was successfully written on-chain
message WriteConfirmed {
  string node = 1;
  string forwarder = 2;
  string receiver = 3;

  // Report Info
  uint32 report_id = 4;
  bytes report_context = 5;
  bytes report = 6;
  uint32 signers_num = 7;

  // When was the report confirmed on-chain
  string block_hash = 8;
  string block_height = 9;
  // TODO: Should we use "google/protobuf/timestamp.proto" for timestamps?
  uint64 block_timestamp = 10;

  // Transmission Info
  string transmitter = 11;
  bool success = 12;
  // TODO: what about EVM's TransmissionInfo parity?
}
