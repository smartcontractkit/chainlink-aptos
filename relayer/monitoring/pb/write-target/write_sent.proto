syntax="proto3";

package write_target;
option go_package = ".;write_target";

// WT sent a transaction on-chain
//
// Notice: we publish txId (TXM ref) vs. txHash (N/A here)
message WriteSent {
  string forwarder = 1;
  string receiver = 2;
  string transmitter = 3;
  uint32 report_id = 4;

  // Transaction ID - tx reference as created by the WT, to be used for tracking TXM execution
  string tx_id = 5;
}
