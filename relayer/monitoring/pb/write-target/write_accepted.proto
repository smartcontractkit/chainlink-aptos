syntax="proto3";

package write_target;
option go_package = ".;write_target";

// WT sent a transaction and it was accepted on-chain
//
// Notice: we publish txId (TXM ref) and txHash (in the future should be available here)
message WriteAccepted {
  string node = 1;
  string forwarder = 2;
  string receiver = 3;

  // Report Info
  uint32 report_id = 4;

  // Transaction ID - tx reference as created by the WT, to be used for tracking TXM execution
  string tx_id = 5;
  string tx_hash = 6;
  string tx_from = 7;
  string tx_status = 8;

  // When was the transaction accepted on-chain
  string block_hash = 9;
  string block_height = 10;
  // TODO: Should we use "google/protobuf/timestamp.proto" for timestamps?
  uint64 block_timestamp = 11;
}
