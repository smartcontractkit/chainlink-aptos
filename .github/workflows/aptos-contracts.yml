name: Aptos - Contracts

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v6

    - name: Install Aptos CLI
      uses: aptos-labs/actions/install-aptos-cli@528ef7ad9427a8c0720ea3eea790a9190d6e377d # 2026-04-09
      with:
        CLI_VERSION: 9.1.0

    - name: Run tests
      run: make move-test
